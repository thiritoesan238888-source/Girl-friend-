# Girl-friend-
A special website for someone special ❤️
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%);
      font-family: sans-serif;
      overflow: hidden;
      text-align: center;
    }
    h2 {
      color: #2b2b2b;
      font-size: 24px;
      margin-bottom: 20px;
      z-index: 2;
    }
    img {
      width: 220px;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      margin-bottom: 30px;
      z-index: 2;
    }
    .buttons {
      display: flex;
      gap: 15px;
      z-index: 2;
    }
    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.2s;
    }
    #yesBtn {
      background-color: #ff3b30;
      color: white;
    }
    #noBtn {
      background-color: white;
      color: #333;
      position: relative;
    }
    .heart {
      position: absolute;
      bottom: -20px;
      color: #ff2a5f;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <h2 id="question">သတိရနေခဲ့တာ သိလား..</h2>
  <img id="mainImg" src="photo.jpg" alt="Photo">

  <div class="buttons">
    <button id="yesBtn" onclick="accepted()">တူတူပဲ</button>
    <button id="noBtn" ontouchstart="moveBtn()" onmouseover="moveBtn()">မရတော့ပါဘူး</button>
  </div>

  <script>
    function moveBtn() {
      const btn = document.getElementById('noBtn');
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function accepted() {
      document.getElementById('question').innerText = "ချစ်တယ်နော် ❤️";
      document.querySelector('.buttons').style.display = 'none';
    }

    setInterval(() => {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }, 400);
  </script>

</body>
</html>
